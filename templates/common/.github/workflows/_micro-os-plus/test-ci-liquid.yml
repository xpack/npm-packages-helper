# {{packageHomepage}}
# https://github.com/{{githubProjectOrganization}}/{{githubProjectName}}/actions/workflows/test-ci.yml

# Workflow for running some tests on each Push.
name: Test on Push

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions
# https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows

on:
  # Runs on pushes, if all conditions are met:
  push:
    # ... on the active branches ...
    branches:
      - 'xpack-development'
      - 'xpack'
    # ... skip tags only ...
    tags-ignore:
      - '**'
    # ... include everything except ...
    paths-ignore:
      - '.claude/**'
      - '.github/skills/**'
      - '.github/workflows/publish-github-pages.yml'
      - '.github/workflows/test-all.yml'
      - '.github/copilot-instructions.md'
      - '.github/FUNDING.yml'
      - '.settings/**'
      - '.vscode/**'
      - 'maintenance/**'
      - 'tests/scripts/**'
      - 'website/**'
      - 'LICENSE*'
      - '**.md'
      - '.gitignore'
      - '.npmignore'
      - '**/README**'

# Allow one concurrent run per push; new pushes cancel older runs.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: 'tests-ci-{% raw %}${{ github.ref_name }}{% endraw %}'
  # A new push to the same branch cancels the older run.
  cancel-in-progress: true

jobs:
  ci-test:
    name: '{{topConfig.descriptiveName}} CI tests'

    runs-on: {% raw %}${{ matrix.os }}{% endraw %}

    strategy:
      # Run all platforms to completion, even if one fails.
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images
        os:
          [
            '{{ topConfig.githubActionsOses | join: '\',
            \'' }}'
          ]
        # https://nodejs.org/en - use LTS
        node-version: ['{{ topConfig.githubActionsNodeVersions | join: ', ' }}']
        # https://www.npmjs.com/package/xpm
        xpm-version: ['{{ topConfig.githubActionsXpmVersions | join: ', ' }}']

    steps:
      - name: Checkout
        # https://github.com/actions/checkout/
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 3

      - name: {% raw %}Setup Node.js ${{ matrix.node-version }} on ${{ matrix.os }}{% endraw %}
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: {% raw %}${{ matrix.node-version }}{% endraw %}

      - name: {% raw %}Install xpm@${{ matrix.xpm-version }} on ${{ matrix.os }}{% endraw %}
        run: npm install -g {% raw %}xpm@${{ matrix.xpm-version }}{% endraw %}

      - name: Show environment
        run: |
          id
          uname -a
          node --version
          npm --version
          xpm --version
          env | sort

      - name: {% raw %}Satisfy project dependencies on ${{ matrix.os }}{% endraw %}
        run: |
          npm ci
          npm {% if hasFolderTestsPackage %}--prefix tests {% endif %}ci
          xpm install{% if hasFolderTestsPackage %} -C tests{% endif %}
          xpm run install-ci{% if hasFolderTestsPackage %} -C tests{% endif %}

      - name: {% raw %}Run tests on ${{ matrix.os }}{% endraw %}
        run: xpm run test-ci{% if hasFolderTestsPackage %} -C tests{% endif %}
        env:
          CI: true
