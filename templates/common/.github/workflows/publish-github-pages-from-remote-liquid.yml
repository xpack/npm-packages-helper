# {{packageHomepage}}
# https://github.com/{{githubProjectOrganization}}/{{githubProjectName}}/actions/workflows/publish-github-pages-from-remote.yml

# Simple workflow for deploying static content to GitHub Pages
name: GitHub Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      repository:
        description: The GitHub repository with the web content
        required: true
      ref:
        description: The branch with the web content
        required: true

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Queue concurrent deployments per source repository/ref instead of
# cancelling them: cancelling the job does not reliably cancel the
# in-flight Pages-side deployment, which can leave the environment
# stuck for the next run.
# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: '{% raw %}pages-${{ inputs.repository }}-${{ inputs.ref }}{% endraw %}'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: {% raw %}${{steps.deployment.outputs.page_url}}{% endraw %}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@v6.0.2
        with:
          repository: '{% raw %}${{inputs.repository}}{% endraw %}'
          ref: '{% raw %}${{inputs.ref}}{% endraw %}'
          # The full history, required to compute lastUpdatedAt
          fetch-depth: 0

      - name: Use Nodejs
        # https://github.com/actions/setup-node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix website ci
{% if githubProjectOrganization == 'micro-os-plus' %}
      - name: Install Doxygen
        # https://www.doxygen.nl/download.html
        env:
          DOXYGEN_VERSION: "1.17.0"
        run: |
          curl https://www.doxygen.nl/files/doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz --output doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz
          tar xf doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz
          ls -l doxygen-$DOXYGEN_VERSION
          mkdir -pv website/doxygen/.local/bin
          ln -sv $(pwd)/doxygen-$DOXYGEN_VERSION/bin/doxygen website/doxygen/.local/bin/doxygen
          ls -lA website website/doxygen
          echo "$(pwd)/website/doxygen/.local/bin" >> $GITHUB_PATH

      - name: Generate Doxygen web preview
        run: |
          doxygen --version
          npm --prefix website run generate-webpreview-doxygen
{% elsif githubProjectOrganization == 'xpack' %}
      - name: Generate TSDoc
        run: npm --prefix website run generate-website-tsdoc
{% endif %}
      - name: Build the Docusaurus site
        env:
          DOCUSAURUS_BASEURL: '{{baseUrl}}'{% if topConfig.isWebPreview %}
          DOCUSAURUS_IS_PREVIEW: 'true'{% endif %}
        run: npm --prefix website run build

      - name: Setup Pages
        # https://github.com/actions/configure-pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        # https://github.com/actions/upload-pages-artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          # Upload entire repository
          path: './website/build'

      # The GitHub Pages backend intermittently leaves a deployment stuck
      # in "queued"/"syncing_files" past the action's 10-minute poll
      # timeout (unresolved upstream issue, see
      # https://github.com/actions/deploy-pages/issues/406). Retry with a
      # cooldown, since an immediate retry against the just-cancelled SHA
      # fails fast.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        # https://github.com/actions/deploy-pages
        uses: actions/deploy-pages@v5.0.0

      - name: Wait before retrying deployment (1)
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.0

      - name: Wait before retrying deployment (2)
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: actions/deploy-pages@v5.0.0

      - name: Resolve deployment result
        id: deployment
        if: always()
        run: |
          page_url="{% raw %}${{ steps.deploy_attempt_3.outputs.page_url || steps.deploy_attempt_2.outputs.page_url || steps.deploy_attempt_1.outputs.page_url }}{% endraw %}"
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          if [ -z "$page_url" ]; then
            exit 1
          fi
